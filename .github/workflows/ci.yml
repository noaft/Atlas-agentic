name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  workflow:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate GitHub Actions workflows
        run: |
          archive_path="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive_path"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive_path" | sha256sum --check
          tar -xzf "$archive_path" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Test release helpers
        run: node --test scripts/release.test.mjs

      - name: Install frontend dependencies
        run: npm ci --prefix desktop

      - name: Audit frontend dependencies
        run: npm audit --prefix desktop --audit-level=high

      - name: Test desktop frontend
        run: npm --prefix desktop test

      - name: Build desktop frontend
        run: npm --prefix desktop run build

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libxcb1-dev \
            libxrandr-dev

      - name: Install project Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Lint Rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  windows:
    name: Windows tests and installer
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ATLAS_SKIP_DOTENV: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install project Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache Windows Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          key: windows-release-x64
          workspaces: |
            . -> target
            desktop/src-tauri -> target

      - name: Test Rust core on Windows
        timeout-minutes: 8
        run: cargo test --locked --no-fail-fast -- --nocapture

      - name: Diagnose failed Windows unit tests in sequence
        if: ${{ failure() }}
        timeout-minutes: 5
        run: cargo test --locked --lib -- --nocapture --test-threads=1

      - name: Test desktop Rust bridge on Windows
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml -- --nocapture

      - name: Install Node for Windows packaging
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Validate Windows package version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          node scripts/check-release-version.mjs "v$version"

      - name: Install Windows frontend dependencies
        run: npm ci --prefix desktop

      - name: Build Windows installer for review
        timeout-minutes: 20
        run: npm --prefix desktop run tauri -- build --config src-tauri/tauri.release.conf.json --target x86_64-pc-windows-msvc --ci -- --locked

      - name: Stage Windows installer and checksum
        shell: pwsh
        run: node scripts/prepare-windows-release.mjs "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" "$env:RUNNER_TEMP/atlas-windows-ci"

      - name: Upload Windows installer for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: atlas-windows-x64-ci
          path: ${{ runner.temp }}/atlas-windows-ci/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libdbus-1-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install project Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Cache desktop Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: desktop
          workspaces: desktop/src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix desktop

      - name: Check desktop Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Test desktop Rust bridge
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Lint desktop Rust bridge
        run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Compile Tauri desktop application
        run: npm --prefix desktop run tauri -- build --debug --no-bundle --ci -- --locked
