name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libxcb1-dev \
            libxrandr-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Lint Rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libdbus-1-dev \
            libxcb1-dev \
            libxrandr-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache desktop Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop
          workspaces: desktop/src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix desktop

      - name: Check desktop Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Test desktop Rust bridge
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Lint desktop Rust bridge
        run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test desktop frontend
        run: npm --prefix desktop test

      - name: Build desktop frontend
        run: npm --prefix desktop run build

      - name: Compile Tauri desktop application
        run: npm --prefix desktop run tauri -- build --debug --no-bundle --ci -- --locked
