[package]
name = "atlas-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "atlas-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
atlas-agentic = { path = "../.." }
serde = { version = "1", features = ["derive"] }
tauri = "=2.12.1"

[dev-dependencies]
tempfile = "3"
