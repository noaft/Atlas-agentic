[package]
name = "atlas-agentic"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lib]
name = "atlas_agentic"
path = "src/lib.rs"

[[bin]]
name = "atlas"
path = "src/main.rs"
