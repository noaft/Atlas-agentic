[package]
name = "atlas-agentic"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cap-std = "4.0.3"
directories = "6"
dotenvy = "0.15"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
active-win-pos-rs = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
enigo = { version = "0.6.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "atlas_agentic"
path = "src/lib.rs"

[[bin]]
name = "atlas"
path = "src/main.rs"
